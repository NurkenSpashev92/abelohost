services:
  ab_app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: ab_app
    container_name: ab_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      PHP_IDE_CONFIG: serverName=server
    depends_on:
      ab_mysql:
        condition: service_healthy

  ab_nginx:
    image: nginx:1.29
    container_name: ab_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ab_app

  ab_mysql:
    image: mysql:26.7
    container_name: ab_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
