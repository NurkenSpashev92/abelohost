services:
  ab_app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: ab_app
    container_name: ab_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: serverName=server
    depends_on:
      ab_mysql:
        condition: service_healthy

  ab_nginx:
    image: nginx:latest
    container_name: ab_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/conf/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ab_app

  ab_mysql:
    image: mysql:latest
    container_name: ab_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
